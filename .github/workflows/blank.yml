name: Matrix Test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21', '25']
      fail-fast: false

    defaults:
      run:
        working-directory: ./StudentApp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Run tests
        run: mvn test